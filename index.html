<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Régie</title>
  <meta name="description" content="Planning, idées et tâches pour mes vidéos et mes streams.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Régie">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="boot" class="boot">Chargement…</div>

  <!-- Connexion -->
  <main id="auth" class="auth" hidden>
    <form id="auth-form" class="glass auth-card" novalidate>
      <h1 id="auth-title">Connexion</h1>
      <p class="muted" id="auth-sub">Retrouve ton planning, tes idées et tes tâches sur tous tes appareils.</p>
      <label class="field">
        <span>Adresse e-mail</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" name="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <button class="btn primary wide" type="submit" id="auth-submit">Se connecter</button>
      <button class="btn link" type="button" id="auth-toggle">Créer un compte</button>
    </form>
  </main>

  <!-- Application -->
  <div id="app" class="app" hidden>
    <aside class="sidebar glass" aria-label="Modules">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <span id="brand-name">Régie</span>
      </div>
      <div><p class="nav-label">Modules</p><nav id="nav" class="nav"></nav></div>
      <div class="soon">
        <p class="soon-title">Prochaines phases</p>
        <ul>
          <li>Clips</li><li>Stream</li><li>Agents IA</li>
          <li>Mails</li><li>Publication</li><li>Équipe</li>
        </ul>
      </div>
      <div class="account">
        <span class="account-mail" id="account-mail"></span>
        <button class="icon-btn" type="button" data-action="theme" aria-label="Changer de thème" title="Thème clair ou sombre">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="sign-out" id="sign-out" aria-label="Se déconnecter" title="Se déconnecter">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h9"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="view-title">Accueil</h1>
        <div class="search">
          <input type="search" id="search" placeholder="Rechercher…" aria-label="Rechercher une vidéo, une idée ou une tâche" autocomplete="off">
          <kbd>K</kbd>
          <div id="search-results" class="search-results glass" hidden></div>
        </div>
        <button class="btn primary" type="button" data-action="quick-add" id="quick-add">Ajouter</button>
      </header>
      <p id="demo-banner" class="demo-banner" hidden>
        Mode démo : les données restent sur cet appareil et ne sont pas synchronisées.
      </p>
      <section id="view" class="view" tabindex="-1"></section>
    </div>

    <nav id="tabbar" class="tabbar glass" aria-label="Modules"></nav>
  </div>

  <dialog id="modal" class="modal glass"></dialog>
  <div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
